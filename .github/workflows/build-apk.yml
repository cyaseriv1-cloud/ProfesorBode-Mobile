name: Compilar APK Android (ProfesorBode Mobile)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK con Vite, Capacitor y Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias del proyecto
        run: npm ci || npm install

      - name: 5. Compilar proyecto Vite (dist/)
        run: npm run build

      - name: 6. Sincronizar Capacitor Android
        run: |
          npx cap sync android

      - name: 7. Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: 8. Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 9. Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ProfesorBode-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
